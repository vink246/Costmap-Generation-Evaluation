# configs/train_nyu_hybrid.yaml
out_dir: runs/nyu_hybrid
data_root: data/processed
dataset: nyu
batch_size: 12
epochs: 5
num_workers: 4
model_module: src.models.hybrid
model_class: HybridCNNTransformer
model_kwargs:
  in_channels: 4
  out_channels: 1
  base: 32
  tf_layers: 2
  tf_heads: 4
  tf_mlp: 2.0
lr: 0.0008
loss_weights:
  l1: 1.0
  dice: 0.5
  boundary: 0.1
