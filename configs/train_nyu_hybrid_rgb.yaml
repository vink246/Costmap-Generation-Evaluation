# configs/train_nyu_hybrid_rgb.yaml
out_dir: runs/nyu_hybrid_rgb      # new run folder
data_root: data/processed
dataset: nyu
batch_size: 12
epochs: 5
num_workers: 4

model_module: src.models.hybrid
model_class: HybridCNNTransformer
model_kwargs:
  in_channels: 3          # <--- change from 4 to 3 (RGB only)
  out_channels: 1
  base: 32
  tf_layers: 2
  tf_heads: 4
  tf_mlp: 2.0

lr: 0.0008
loss_weights:
  l1: 1.0
  dice: 0.5
  boundary: 0.1
